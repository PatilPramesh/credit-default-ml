name: Keep Streamlit App Awake

# Pings the deployed Streamlit app on a schedule so the free-tier instance
# stays warm (reduces "app is asleep" when evaluators open the link).
#
# ONE-TIME SETUP (required or this workflow does nothing):
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables
#   Name:  STREAMLIT_APP_URL
#   Value: https://credit-default-ml-bits-pramesh-patil.streamlit.app
#
# Schedule: every 20 minutes (GitHub may delay cron by a few minutes).
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          URL="${{ vars.STREAMLIT_APP_URL }}"
          if [ -z "$URL" ]; then
            echo "STREAMLIT_APP_URL is not set. Add it under Settings -> Actions -> Variables."
            exit 0
          fi
          echo "Pinging $URL at $(date -u)"
          curl -sS -L -o /dev/null -w "HTTP status: %{http_code}\n" \
            --max-time 60 \
            -A "GitHub-Actions-KeepAlive/1.0" \
            "$URL" || true
